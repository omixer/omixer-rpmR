# R CMD check (with the RUnit tests, the app's included) on Linux, macOS and Windows, with Java 21
name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      # sets JAVA_HOME, which rpm() uses first
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Suggests included: the app's tests need shiny and the chart packages
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
